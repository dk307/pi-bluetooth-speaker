[workspace]
resolver = "2"
members = [
    "services/core",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Audio Appliance Team"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
