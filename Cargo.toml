[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/hardware",
    "crates/dsp",
    "crates/bluetooth",
    "crates/title-breaker",
    "services/screen-manager",
    "services/bt-manager",
    "tools/diagnostics",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
authors = ["Audio Appliance Team"]
license = "Apache-2.0"

[workspace.dependencies]
speaker-common = { path = "crates/common" }
speaker-hardware = { path = "crates/hardware" }
speaker-dsp = { path = "crates/dsp" }
speaker-bluetooth = { path = "crates/bluetooth" }
speaker-title-breaker = { path = "crates/title-breaker" }

# Asynchronous Concurrency Runtime
tokio = { version = "=1.53.3", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["connect"] }
futures-util = "=0.3.34"

# D-Bus Engine for BlueZ 5 & BlueALSA
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "blocking-api"] }

# Serialization & JSON-RPC
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = { version = "=3.17.1", default-features = false }

# Layered Configuration File Reader (JSON sources; JSON writer stays serde_json)
config = { version = "=0.15.27", default-features = false, features = ["json"] }

# Raspberry Pi Hardware Peripherals (GPIO, Hardware PWM, I2C)
rppal = { version = "=0.22.1", features = ["hal"] }
bh1750-embedded = "=0.1.0"

# EC12 Quadrature Decoding (interrupt-driven) & RGB Indicator Color Mapping
rotary-switch-helper = "=0.3.0"
led = "=0.3.1"
embedded-hal = "=0.2.7"
anyhow = "=1.0.102"

# Image Processing (Cover Art Scaling & Procedural Vinyl)
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

# Logging & Structured Tracing
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Async Trait for Trait-based Dependency Injection / Mocks
async-trait = "=0.1.86"
memmap2 = "=0.9.12"

# Direct OBEX Cover Art over RFCOMM/L2CAP (AVRCP/BIP)
bluer = { version = "=0.17.4", default-features = false, features = ["rfcomm", "l2cap"] }
obex-protocol = { version = "=0.1.0", default-features = false, features = ["tokio"] }
bluesdp = "=0.1.1"

# Raw syscalls & signal handling
libc = "=0.2.191"
ctrlc = "=3.4.2"

# UI Framework (Slint with Linux Framebuffer & KMS/DRM backends)
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
i-slint-core = { version = "=1.18.1", features = ["svg", "image-decoders", "image-default-formats"] }
slint-build = "=1.18.1"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
too_long_first_doc_paragraph = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
literal_string_with_formatting_args = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
