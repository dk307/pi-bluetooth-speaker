# Resampler algorithm for incoming audio above 48 kHz
defaults.pcm.rate_converter "speexrate_medium"

# Direct sample mixer locked to 48 kHz / S32_LE
pcm.dsp_dmix {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,0"
        format S32_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}

# Default PCM routes through plug to handle arbitrary input rates
pcm.!default {
    type plug
    slave.pcm "dsp_dmix"
}

ctl.!default {
    type hw
    card sndrpimerusamp
}
