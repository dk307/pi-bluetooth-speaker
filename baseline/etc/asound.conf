# Per-source ALSA Loopback aliases (isolated subdevices prevent EBUSY contention).
pcm.src_bluetooth {
    type plug
    slave.pcm "hw:Loopback,0,0"
}

pcm.src_rmpd {
    type plug
    slave.pcm "hw:Loopback,0,1"
}

# Fallback default targets subdevice 0 for legacy/CLI callers.
pcm.!default {
    type plug
    slave.pcm "hw:Loopback,0,0"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}
