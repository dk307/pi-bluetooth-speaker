[General]
Experimental = true
Name = DietPi Speaker
Class = 0x240414
DiscoverableTimeout = 0
PairableTimeout = 0
ControllerMode = bredr

[Policy]
AutoEnable = true

[AVRCP]
# BlueZ >= 5.88 defaults this to true and rejects AVRCP absolute volume from
# phones whose own AVRCP Target SDP record lacks the category-2 feature bit
# (e.g. Pixel: TG 1.4 without category-2). That silently kills phone -> sink
# volume sync (MediaTransport1.Volume frozen; Merus amp never follows).
# See docs/rpi_audio_bluetooth_report.md 7.6.1 (Rank 0 gate).
VolumeCategory = false
