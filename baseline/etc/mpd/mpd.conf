# C-based Music Player Daemon (MPD 0.25+) configuration for Raspberry Pi 3 Audio Appliance
#
# Uses snd-aloop subdevice 1 (`src_rmpd`) and `mixer_type "null"` so MPD
# exposes a virtual 0-100 volume slider (synced bidirectionally with the
# MA12070P hardware amp by audio-manager) without applying software PCM
# attenuation.

playlist_directory  "/var/lib/mpd/playlists"
state_file          "/var/lib/mpd/state"
bind_to_address     "0.0.0.0"
port                "6600"
filesystem_charset  "UTF-8"
audio_buffer_size   "512"

input {
    plugin "curl"
}

input {
    plugin  "ffmpeg"
    enabled "no"
}

audio_output {
    type        "alsa"
    name        "ALSA"
    device      "src_rmpd"
    mixer_type  "null"
    buffer_time "100000"
}
