<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.speaker.AudioManager"/>
    <allow send_destination="org.speaker.AudioManager"/>
    <allow receive_sender="org.speaker.AudioManager"/>
  </policy>
  <!-- Mutating methods on org.speaker.AudioManager1 and org.speaker.AudioSources1
       are intentionally restricted to root (matching screen-manager and bt-manager);
       non-root callers may only read properties and introspect. -->
  <policy context="default">
    <allow send_destination="org.speaker.AudioManager"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.speaker.AudioManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow receive_sender="org.speaker.AudioManager"/>
  </policy>
</busconfig>
