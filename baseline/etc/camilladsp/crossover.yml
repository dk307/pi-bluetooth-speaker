devices:
  samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  enable_rate_adjust: true
  # Pop-prevention lever (plan §11.3): when the capture signal stays below
  # -60 dB for this long, the engine reports Paused. dsp_watch mutes only
  # after it observes a stopped state, so this setting does not by itself
  # guarantee a mute before BCLK stops.
  silence_threshold: -60
  silence_timeout: 3.0
  capture:
    type: Alsa
    channels: 2
    device: "hw:Loopback,1,0"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    # hifiberry-dac (PCM5102A) card — the merus overlay card is removed
    # (verified live: /proc/asound/cards "sndrpihifiberry", card 1).
    device: "hw:sndrpihifiberry,0"
    format: S32_LE
