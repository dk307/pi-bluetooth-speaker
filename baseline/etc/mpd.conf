# Streaming & internet-radio MPD v0.25 configuration for Raspberry Pi 3 Audio Appliance.
# Privileges are dropped by systemd (User=mpd, SupplementaryGroups=audio).
# Audio routes through ALSA `src_rmpd` -> hw:Loopback,0,1 -> CamillaDSP.
# Uses `mixer_type "null"` so MPD exposes a virtual 0-100 volume slider synced
# bidirectionally with the MA12070P hardware amp by audio-manager without
# applying software PCM attenuation.

playlist_directory  "/var/lib/mpd/playlists"
state_file          "/var/lib/mpd/state"

# Intentional trusted home-LAN binding so phone MPD clients can control playback;
# switch to "127.0.0.1" or configure an MPD `password` on untrusted networks.
bind_to_address     "0.0.0.0"
port                "6600"
filesystem_charset  "UTF-8"
audio_buffer_size   "512"

# Intentional curl input plugin for streaming internet radio stations.
input {
    plugin "curl"
}

input {
    plugin  "ffmpeg"
    enabled "no"
}

audio_output {
    type        "alsa"
    name        "ALSA"
    device      "src_rmpd"
    mixer_type  "null"
    buffer_time "100000"
}
