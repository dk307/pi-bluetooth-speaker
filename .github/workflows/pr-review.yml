name: PR-Agent AI PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: PR-Agent AI Review (${{ matrix.name }})
    continue-on-error: ${{ matrix.optional || false }}
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.fork == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' &&
         (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/improve') || startsWith(github.event.comment.body, '/ask') || startsWith(github.event.comment.body, '/describe')) &&
         (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Primary"
            model: "openrouter/@preset/code-review"
            reasoning_max_tokens: "12000"
            optional: false
          - name: "Alt-1"
            model: "openrouter/@preset/code-review-alt-1"
            reasoning_max_tokens: "12000"
            optional: false
          - name: "Free"
            model: "openrouter/@preset/code-review-free"
            reasoning_max_tokens: "12000"
            optional: true
    steps:
      - name: Verify OpenRouter API Key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "ERROR: OPENROUTER_API_KEY secret is required for PR-Agent code review." >&2
            exit 1
          fi

      - name: Run PR-Agent (${{ matrix.name }})
        continue-on-error: ${{ matrix.optional || false }}
        uses: the-pr-agent/pr-agent@981344be2755e303df501e18e3f60b848a188a80 # v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER__REASONING_MAX_TOKENS: ${{ matrix.reasoning_max_tokens }}
          CONFIG__MODEL: ${{ matrix.model }}
          # PR_AGENT_CONFIG_BRANCH points to the PR branch for pull_request events
          # (where github.head_ref is available), allowing .pr_agent.toml changes to be
          # tested before merging. For issue_comment triggers, github.head_ref is empty
          # and falls back to github.ref_name (the default branch where .pr_agent.toml lives once merged).
          # The PR head ref is safe because the job is strictly gated above against fork PRs.
          PR_AGENT_CONFIG_BRANCH: ${{ github.head_ref || github.ref_name }}
          CONFIG__CONFIG_BRANCH: ${{ github.head_ref || github.ref_name }}
