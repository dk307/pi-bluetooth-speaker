name: DiffGuard AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: DiffGuard AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build custom review prompt from guidelines
        id: build-prompt
        run: python3 .github/scripts/generate_review_prompt.py

      - name: Enable file-based custom_prompt in DiffGuard
        run: |
          python3 -c "
          import glob, os, sys
          workspace = os.environ.get('GITHUB_WORKSPACE', '.')
          search_roots = [
              '/home/runner/work/_actions',
              os.path.abspath(os.path.join(workspace, '..', '..', '_actions')),
              os.path.abspath(os.path.join(workspace, '..', '_actions')),
          ]
          found = False
          for root in search_roots:
              if not os.path.exists(root):
                  continue
              for p in glob.glob(os.path.join(root, '**', 'diffguard', '**', 'dist', 'index.js'), recursive=True):
                  with open(p, 'r', encoding='utf-8') as f:
                      content = f.read()
                  target = \"const customPrompt = core.getInput('custom_prompt');\"
                  patch = \"let customPrompt = core.getInput('custom_prompt'); try { const _fs = require('fs'); if (customPrompt && _fs.existsSync(customPrompt)) { customPrompt = _fs.readFileSync(customPrompt, 'utf8'); } } catch (_) {}\"
                  if target in content:
                      with open(p, 'w', encoding='utf-8') as f:
                          f.write(content.replace(target, patch))
                      print(f'Successfully enabled file-based prompt in {p}')
                      found = True
          if not found:
              print(f'Warning: diffguard bundle not found in search roots: {search_roots}')
          "

      - name: Run DiffGuard AI PR Review
        uses: jonit-dev/diffguard@88f63615c769f8db6031973503c2c40a9a3f4feb # v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          open_router_key: ${{ secrets.OPENROUTER_API_KEY }}
          model_id: "@preset/code-review"
          max_tokens: "8192"
          custom_prompt: ${{ steps.build-prompt.outputs.prompt_file }}
