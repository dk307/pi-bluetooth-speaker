name: PR-Agent AI PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: PR-Agent AI Review (${{ matrix.name }})
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.fork == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' && startsWith(github.event.comment.body, '/') &&
         (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Preset Primary"
            model: "openrouter/@preset/code-review"
          - name: "Preset Alt-1"
            model: "openrouter/@preset/code-review-alt-1"
    steps:
      - name: Verify OpenRouter API Key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "ERROR: OPENROUTER_API_KEY secret is required for PR-Agent code review." >&2
            exit 1
          fi

      - name: Run PR-Agent (${{ matrix.name }})
        uses: the-pr-agent/pr-agent@981344be2755e303df501e18e3f60b848a188a80 # v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER__REASONING_MAX_TOKENS: "8000"
          CONFIG__MODEL: ${{ matrix.model }}
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__MAX_MODEL_TOKENS: "256000"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "256000"
          CONFIG__MAX_OUTPUT_TOKENS: "32768"
          CONFIG__ENABLE_LARGE_PR_HANDLING: "true"
          CONFIG__REPO_CONTEXT_FILES: '["AGENTS.md", "services/core/AGENTS.md", "services/.guidelines/microsoft-rust-guidelines.md"]'
          CONFIG__REPO_CONTEXT_MAX_LINES: "4000"
          CONFIG__REPO_CONTEXT_FROM_DEFAULT_BRANCH: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/review"]'
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: "true"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "true"
          PR_REVIEWER__PERSISTENT_COMMENT: "false"
          PR_CODE_SUGGESTIONS__PERSISTENT_COMMENT: "false"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: >-
            Reviewing with Model: ${{ matrix.name }} (${{ matrix.model }}).
            You are reviewing Rust code for a Raspberry Pi 3 embedded audio/DSP appliance.
            Verify that the pull request strictly adheres to the Microsoft Pragmatic Rust Guidelines (services/.guidelines/microsoft-rust-guidelines.md, services/core/AGENTS.md, AGENTS.md):
            1. Mockable I/O (M-MOCKABLE-SYSCALLS, M-DI-HIERARCHY): Verify hardware I/O and peripherals are isolated behind inherent mocks (new_mocked()) rather than unmockable syscalls or leaky traits.
            2. Strong Typing & Invariants (M-STRONG-TYPES, M-STRONG-TYPES-GUARD): Verify domain newtypes validate invariants at construction time (SensorId, I2cAddress) and reject signed/invalid inputs at boundaries. Guard float types against NaN via .is_finite().
            3. Canonical Errors & Clean Propagation (M-ERRORS-CANONICAL-STRUCTS, M-FROM-ERROR): Verify error types are canonical structs with captured backtraces and query predicates (is_*), propagating errors via ? through From<ForeignError> rather than manual .map_err(). Flag any .unwrap() or .expect() on fallible paths.
            4. Panic Discipline (M-PANIC-IS-STOP, M-PANIC-ON-BUG): Panics must represent bugs or unrecoverable termination, never expected hardware/runtime I/O failures. Thread worker panics must unwind with resume_unwind.
            5. Surface & Documentation (M-SINGLE-ITEM-PATH, M-NO-GLOB-REEXPORTS, M-MODULE-DOCS, M-CANONICAL-DOCS, M-FIRST-DOC-SENTENCE): Verify single canonical item paths, no glob re-exports, //! module docs, ~15-word concise doc summaries, and canonical # Examples/# Errors/# Panics sections.
            6. Lints (M-LINT-OVERRIDE-EXPECT): Verify #[expect(..., reason = "...")] is used instead of #[allow].
            7. Memory & Types (M-BOX-DST, M-AVOID-WRAPPERS, M-SIMPLE-ABSTRACTIONS): Verify Box<str> / Box<[T]> for immutable owned strings and paths; flag redundant nested smart pointers or multi-layered locks.

            Adhere strictly to repository review triage rules (AGENTS.md Section 4.1):
            - Report Tier 1 (correctness, physical hardware protocol bugs, safety) and Tier 2 (build, clippy warnings, test failures, coverage < 90%) issues.
            - Do NOT report subjective Tier 3 style nitpicks or suggest speculative abstractions.
            - Include a dedicated "How Code Can Be Simplified" evaluation identifying duplicated logic to unify, over-engineered abstractions to flatten, and lines of code that can be removed while preserving safety and domain invariants.
