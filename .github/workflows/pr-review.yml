name: PR-Agent AI PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: PR-Agent AI Code Review
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify OpenRouter API Key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "ERROR: OPENROUTER_API_KEY secret is required for PR-Agent code review." >&2
            exit 1
          fi

      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@981344be2755e303df501e18e3f60b848a188a80 # v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG__MODEL: "openrouter/anthropic/claude-3.5-sonnet"
          CONFIG__FALLBACK_MODELS: '["openrouter/openai/gpt-4o"]'
          CONFIG__REPO_CONTEXT_FILES: '["AGENTS.md", "services/core/AGENTS.md"]'
          CONFIG__REPO_CONTEXT_MAX_LINES: '1000'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/review"]'
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: "true"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "true"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: >-
            Strictly adhere to the Microsoft Pragmatic Rust Guidelines and the repository review-triage rules in AGENTS.md.
            Only report Tier 1 (correctness, physical hardware protocol bugs, safety) and Tier 2 (build, clippy warnings, test failures, coverage < 90%) issues.
            Do not recommend subjective style refactorings, speculative abstractions, or out-of-scope changes.
