name: DiffGuard AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: DiffGuard AI Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run DiffGuard AI PR Review
        uses: jonit-dev/diffguard@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          open_router_key: ${{ secrets.OPENROUTER_API_KEY }}
          model_id: "anthropic/claude-3.5-sonnet"
          max_tokens: "4096"
          delete_previous_comments: "false"
          custom_prompt: |
            You are reviewing pull requests for the Raspberry Pi Bluetooth Speaker & DSP Appliance project.
            Perform a rigorous, constructive, and actionable engineering review adhering strictly to the guidelines and standards below.

            ### Project Standards & Architecture Checklist:
            1. Target Hardware & Platform:
               - Target: Raspberry Pi 3 Model B (Broadcom BCM2837, quad-core ARM Cortex-A53 aarch64, DietPi / Debian 13 Trixie).
               - Target optimization: -C target-cpu=cortex-a53, -C target-feature=+neon.
               - Code must not rely on x86-specific intrinsics or unsupported features on aarch64.

            2. Microsoft Pragmatic Rust Guidelines Compliance:
               - Inherent Mocking (M-MOCKABLE-SYSCALLS, M-DI-HIERARCHY): All hardware drivers (I2C, 1-Wire sysfs, GPIO, PWM) must provide inherent mocking via `new_mocked() -> (Self, MockCtrl)`. Never make raw ad-hoc syscalls without a mockable abstraction.
               - Multi-Purpose Drivers: Peripheral abstractions must be cheaply cloneable (Arc-backed per M-SERVICES-CLONE), Send + Sync (M-TYPES-SEND), with non-blocking async methods using `tokio::task::spawn_blocking` for slow hardware I/O.
               - Strong Typing (M-STRONG-TYPES, M-STRONG-TYPES-GUARD): Avoid primitive obsession; use validated domain newtypes guarding invariants at construction time (e.g., BcmPin, PhysicalPin, Temperature, Illuminance, SensorId, I2cAddress).
               - Canonical Error Handling (M-ERRORS-CANONICAL-STRUCTS, M-FROM-ERROR, M-PANIC-IS-STOP):
                 * Wrap non-public ErrorKind with Backtrace.
                 * Provide `is_*()` query predicates.
                 * NEVER use `.unwrap()` or `.expect()` in fallible runtime paths (M-PANIC-IS-STOP).
               - Clean Architecture: Modular design separating CLI runtime logic (`run_app(&sensor, &opts) -> ExitCode`) from argument parsing so binaries are testable.

            3. Code Quality, Lints & Formatting:
               - Clippy Strictness: Zero warnings under `cargo clippy --all-targets -- -D warnings`.
               - Use `#[expect(..., reason = "...")]` instead of `#[allow(...)]` for intentional lint overrides (M-LINT-OVERRIDE-EXPECT).
               - Formatting: Must format cleanly with `cargo fmt --check`.

            4. Test Coverage Standard:
               - Target: >85%-90%+ test coverage across modules, domain types, mock controllers, and diagnostic CLIs.
               - Check for unit tests, error paths, fault injection tests, and boundary value tests.

            5. Security & Safety:
               - Safe Rust: Prefer 100% safe Rust (`#![forbid(unsafe_code)]` or `#![deny(unsafe_code)]`).
               - Physical SSH testing rule: Non-destructive testing; never mutate persistent host services or configurations.

            Review Format:
            - Brief Summary of changes.
            - Strengths / Good patterns observed.
            - Critical Issues (bugs, invariant violations, unhandled errors, panics).
            - Compliance Findings (Pragmatic Rust, Target Architecture, Code Coverage).
            - Actionable Recommendations with code snippets where helpful.
