name: Build Speaker Core (ARM64 / RPi 3)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpi3:
    name: Build for Raspberry Pi 3 (Cortex-A53 / aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Configure Target Linker
        run: |
          if ! command -v aarch64-linux-gnu-gcc &>/dev/null; then
            sudo ln -sf "$(which gcc)" /usr/local/bin/aarch64-linux-gnu-gcc
          fi

      - name: Run Speaker Core Test Suite with Code Coverage
        run: cargo llvm-cov --manifest-path services/core/Cargo.toml --target aarch64-unknown-linux-gnu --fail-under-lines 90 --fail-under-functions 90 --lcov --output-path lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c773c9f0007ff14bc519d501e730 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Build Speaker Core & Utilities (Release for RPi 3)
        run: cargo build --manifest-path services/core/Cargo.toml --target aarch64-unknown-linux-gnu --release --bins

      - name: Verify Binary Architecture & Compatibility
        run: |
          file target/aarch64-unknown-linux-gnu/release/core
          file target/aarch64-unknown-linux-gnu/release/read_temp
          file target/aarch64-unknown-linux-gnu/release/read_light
          readelf -h target/aarch64-unknown-linux-gnu/release/core
          readelf -h target/aarch64-unknown-linux-gnu/release/read_temp
          readelf -h target/aarch64-unknown-linux-gnu/release/read_light
          ls -lh target/aarch64-unknown-linux-gnu/release/core target/aarch64-unknown-linux-gnu/release/read_temp target/aarch64-unknown-linux-gnu/release/read_light

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba841f # v4.6.1
        with:
          name: core-binaries-aarch64-rpi3
          path: |
            target/aarch64-unknown-linux-gnu/release/core
            target/aarch64-unknown-linux-gnu/release/read_temp
            target/aarch64-unknown-linux-gnu/release/read_light
          if-no-files-found: error
