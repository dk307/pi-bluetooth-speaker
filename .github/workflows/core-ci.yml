name: Build Speaker Core (ARM64 / RPi 3)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpi3:
    name: Build for Raspberry Pi 3 (Cortex-A53 / aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install System Dependencies
        # `yeslogic-fontconfig-sys` (via Slint's fontdb) needs pkg-config and the
        # fontconfig headers; the ubuntu-24.04-arm image ships neither by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check Formatting
        run: cargo fmt --manifest-path services/core/Cargo.toml --all -- --check

      - name: Clippy Lints (deny warnings)
        # Native aarch64 lints cover the cfg paths the coverage gate executes.
        run: cargo clippy --manifest-path services/core/Cargo.toml --all-targets -- -D warnings

      - name: Configure Target Linker
        run: |
          if ! command -v aarch64-linux-gnu-gcc &>/dev/null; then
            sudo ln -sf "$(which gcc)" /usr/local/bin/aarch64-linux-gnu-gcc
          fi

      - name: Run Speaker Core Test Suite with Code Coverage
        run: cargo llvm-cov --manifest-path services/core/Cargo.toml --target aarch64-unknown-linux-gnu --fail-under-lines 90 --fail-under-functions 90 --lcov --output-path lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@e96185f4044c2f0cedf0f022454acf9811cf8057 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Build Speaker Core & Utilities (Release for RPi 3)
        # Cargo discovers `.cargo/config.toml` from the working directory, not from
        # `--manifest-path`; pass it explicitly so Cortex-A53 / NEON rustflags apply.
        run: cargo build --config services/core/.cargo/config.toml --manifest-path services/core/Cargo.toml --target aarch64-unknown-linux-gnu --release --bins

      - name: Verify Binary Architecture & Compatibility
        run: |
          file target/aarch64-unknown-linux-gnu/release/core
          file target/aarch64-unknown-linux-gnu/release/temp-read
          file target/aarch64-unknown-linux-gnu/release/light-read
          readelf -h target/aarch64-unknown-linux-gnu/release/core
          readelf -h target/aarch64-unknown-linux-gnu/release/temp-read
          readelf -h target/aarch64-unknown-linux-gnu/release/light-read
          ls -lh target/aarch64-unknown-linux-gnu/release/core target/aarch64-unknown-linux-gnu/release/temp-read target/aarch64-unknown-linux-gnu/release/light-read

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: core-binaries-aarch64-rpi3
          path: |
            target/aarch64-unknown-linux-gnu/release/core
            target/aarch64-unknown-linux-gnu/release/temp-read
            target/aarch64-unknown-linux-gnu/release/light-read
          if-no-files-found: error

  lint-x86-gated:
    name: Clippy for x86-gated code (x86_64)
    # x86-gated cfg paths (ui feature) only type-check when the host target is
    # x86_64; cross-linting that target on the ARM runner cannot build the C
    # dependencies (yeslogic-fontconfig-sys). Run natively on x86_64 instead.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Clippy Lints (deny warnings)
        run: cargo clippy --manifest-path services/core/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
