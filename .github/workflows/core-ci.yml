name: Build Speaker Core (ARM64 / RPi 3)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-rpi3:
    name: Test & Coverage (Cortex-A53 / aarch64)
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install System Dependencies
        # `yeslogic-fontconfig-sys` (via Slint's fontdb) needs pkg-config and the
        # fontconfig headers; `lld` accelerates linking 32 instrumented test binaries.
        run: |
          if ! dpkg -s pkg-config libfontconfig-dev lld &>/dev/null; then
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev lld
          fi

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: llvm-tools-preview, rustfmt

      - name: Cache Rust Coverage Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "rpi3-llvm-cov"
          cache-on-failure: "true"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Configure Target Linker
        run: |
          if ! command -v aarch64-linux-gnu-gcc &>/dev/null; then
            sudo ln -sf "$(command -v gcc)" /usr/local/bin/aarch64-linux-gnu-gcc
          fi

      - name: Run Speaker Core Test Suite with Code Coverage
        run: |
          cargo llvm-cov --workspace --target aarch64-unknown-linux-gnu --fail-under-lines 85 --fail-under-functions 85 --lcov --output-path lcov.info
          rm -f target/llvm-cov-target/*.profraw target/llvm-cov-target/*.profdata target/llvm-cov-target/*profraw-list

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@e96185f4044c2f0cedf0f022454acf9811cf8057 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Upload Coverage Artifact (LCOV)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: core-lcov-info
          path: lcov.info
          if-no-files-found: error

  build-rpi3:
    name: Build for Raspberry Pi 3 (Cortex-A53 / aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install System Dependencies
        # `yeslogic-fontconfig-sys` (via Slint's fontdb) needs pkg-config and the
        # fontconfig headers; the ubuntu-24.04-arm image ships neither by default.
        run: |
          if ! dpkg -s pkg-config libfontconfig-dev &>/dev/null; then
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev
          fi

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy

      - name: Cache Rust Build Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "rpi3-build"
          cache-on-failure: "true"

      - name: Configure Target Linker
        run: |
          if ! command -v aarch64-linux-gnu-gcc &>/dev/null; then
            sudo ln -sf "$(command -v gcc)" /usr/local/bin/aarch64-linux-gnu-gcc
          fi

      - name: Clippy Lints (deny warnings)
        # Native aarch64 lints cover the cfg paths the coverage gate executes.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Speaker Binaries & Utilities (Release for RPi 3)
        # Workspace root .cargo/config.toml applies Cortex-A53 / NEON flags automatically.
        run: cargo build --workspace --target aarch64-unknown-linux-gnu --release --bins

      - name: Verify Binary Architecture & Compatibility
        run: |
          for bin in screen-manager bt-manager amp-info bt-info dsp-info encoder-read light-read temp-read; do
            file "target/aarch64-unknown-linux-gnu/release/$bin"
            readelf -h "target/aarch64-unknown-linux-gnu/release/$bin"
            ls -lh "target/aarch64-unknown-linux-gnu/release/$bin"
          done

      - name: Verify Glibc Symbol Ceiling (<= GLIBC_2.36)
        run: |
          for bin in screen-manager bt-manager amp-info bt-info dsp-info encoder-read light-read temp-read; do
            bin_path="target/aarch64-unknown-linux-gnu/release/$bin"
            echo "Checking glibc ceiling for $bin"
            objdump -T "$bin_path" | grep -o 'GLIBC_[0-9.]*' | sort -uV | while read -r ver; do
              major=$(echo "$ver" | cut -d_ -f2 | cut -d. -f1)
              minor=$(echo "$ver" | cut -d_ -f2 | cut -d. -f2)
              if [ "$major" -gt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -gt 36 ]; }; then
                echo "ERROR: $bin requires $ver which exceeds glibc 2.36 ceiling!"
                exit 1
              fi
            done
          done

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: core-binaries-aarch64-rpi3
          path: |
            target/aarch64-unknown-linux-gnu/release/screen-manager
            target/aarch64-unknown-linux-gnu/release/bt-manager
            target/aarch64-unknown-linux-gnu/release/amp-info
            target/aarch64-unknown-linux-gnu/release/bt-info
            target/aarch64-unknown-linux-gnu/release/dsp-info
            target/aarch64-unknown-linux-gnu/release/encoder-read
            target/aarch64-unknown-linux-gnu/release/light-read
            target/aarch64-unknown-linux-gnu/release/temp-read
          if-no-files-found: error

  lint-x86-gated:
    name: Clippy for x86-gated code (x86_64)
    # x86-gated cfg paths (ui feature) only type-check when the host target is
    # x86_64; cross-linting that target on the ARM runner cannot build the C
    # dependencies (yeslogic-fontconfig-sys). Run natively on x86_64 instead.
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install System Dependencies
        run: |
          if ! dpkg -s pkg-config libfontconfig-dev lld &>/dev/null; then
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev lld
          fi

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Cache Rust Lint Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "x86-clippy"
          cache-on-failure: "true"

      - name: Clippy Lints (deny warnings)
        run: cargo clippy --workspace --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

  cargo-crap:
    name: CRAP Score & Regression Gate (cargo-crap)
    needs: test-rpi3
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Coverage Artifact (LCOV)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: core-lcov-info

      - name: Cache cargo-crap Release Archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cargo-crap-v0.9.0
          key: cargo-crap-v0.9.0-x86_64-unknown-linux-gnu-5355bfa78ba5bf57

      - name: Install cargo-crap (v0.9.0, SHA-256 pinned)
        id: install-crap
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/cargo-crap-v0.9.0"
          mkdir -p "$cache_dir"
          archive="$cache_dir/cargo-crap-x86_64-unknown-linux-gnu.tar.gz"
          if [ ! -f "$archive" ]; then
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/minikin/cargo-crap/releases/download/v0.9.0/cargo-crap-x86_64-unknown-linux-gnu.tar.gz"
          fi
          echo "5355bfa78ba5bf57e52e125f9dfe3573155796267d3b54660ae1c0225916d603  $archive" | sha256sum -c -
          dir="$RUNNER_TEMP/cargo-crap-bin"
          mkdir -p "$dir"
          tar xzf "$archive" -C "$dir"
          chmod +x "$dir/cargo-crap"
          echo "$dir" >> "$GITHUB_PATH"
          echo "binary=$dir/cargo-crap" >> "$GITHUB_OUTPUT"

      - name: Prepare CRAP Baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CARGO_CRAP_BIN: ${{ steps.install-crap.outputs.binary }}
        run: |
          set -euo pipefail
          baseline="crap-baseline.json"
          rm -f "$baseline"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # 1. Reuse the `crap-baseline` artifact from the latest successful `main` push run if available.
            run_ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/core-ci.yml/runs?branch=main&event=push&status=success&per_page=5" \
              --jq '.workflow_runs[].id' 2>/dev/null || true)"
            for run_id in $run_ids; do
              if gh run download "$run_id" --name crap-baseline --dir . 2>/dev/null && [ -s "$baseline" ]; then
                break
              fi
              rm -f "$baseline"
            done

            # 2. Bootstrap fallback before the first `main` baseline artifact is published:
            #    score the PR base commit AST in an isolated worktree without re-running tests.
            if [ ! -s "$baseline" ]; then
              dir="$RUNNER_TEMP/cargo-crap-bootstrap"
              mkdir -p "$dir"
              base_sha="$BASE_SHA"
              if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                git fetch -q --no-tags --depth=1 origin "$base_sha"
                base_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
              fi
              git worktree add -q --detach "$dir/base-tree" "$base_sha"
              trap 'git worktree remove --force "$dir/base-tree" 2>/dev/null || true' EXIT
              cp .cargo-crap.toml "$dir/base-tree/.cargo-crap.toml"
              ws_root="$(pwd -P)"
              sed "s|^SF:${ws_root}/|SF:${dir}/base-tree/|" lcov.info > "$dir/base.lcov"
              baseline_abs="$ws_root/$baseline"
              (cd "$dir/base-tree" && "$CARGO_CRAP_BIN" --workspace --lcov "$dir/base.lcov" --format json --sort file --output "$baseline_abs")
            fi
          else
            # On `push` runs (e.g. `main`), generate the baseline JSON for this commit.
            "$CARGO_CRAP_BIN" --workspace --lcov lcov.info --format json --sort file --output "$baseline"
          fi

          test -s "$baseline"
          echo "path=$baseline" >> "$GITHUB_OUTPUT"

      - name: Run cargo-crap
        uses: minikin/cargo-crap@49f67037505997092f3df41d7a88e4fbfa09daee # v0.9.0
        with:
          version: "0.9.0"
          binary: ${{ steps.install-crap.outputs.binary }}
          args: --workspace
          lcov: lcov.info
          baseline: ${{ steps.baseline.outputs.path }}
          fail-regression: "false"
          fail-above: "false"
          comment: "true"

      - name: Upload CRAP Baseline Artifact (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: crap-baseline
          path: crap-baseline.json
          overwrite: true
          if-no-files-found: error
