[package]
name = "autobright"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ambient auto-brightness daemon with a D-Bus single-writer control plane"
default-run = "autobright"
publish = false

[[bin]]
name = "autobright"
path = "src/main.rs"

[dependencies]
speaker-common = { workspace = true }
speaker-hardware = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ctrlc = { workspace = true }
sd-notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
test-util = []

[dev-dependencies]
autobright = { path = ".", features = ["test-util"] }
speaker-hardware = { workspace = true, features = ["test-util"] }
futures-util = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
