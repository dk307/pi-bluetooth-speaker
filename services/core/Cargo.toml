[package]
name = "speaker-core"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Audio Appliance Team"]
description = "Core Appliance Daemon & Logic for Raspberry Pi Bluetooth Speaker"
default-run = "core"

[lib]
name = "speaker_core"
path = "src/lib.rs"

# Main daemon binary; matches DietPi /etc/systemd/system/core.service unit definition.
[[bin]]
name = "core"
path = "src/main.rs"

[[bin]]
name = "temp-read"
path = "src/bin/temp-read.rs"

[[bin]]
name = "light-read"
path = "src/bin/light-read.rs"

[[bin]]
name = "amp-info"
path = "src/bin/amp-info.rs"

[[bin]]
name = "bt-info"
path = "src/bin/bt-info.rs"

[[bin]]
name = "encoder-read"
path = "src/bin/encoder-read.rs"

[[bin]]
name = "dsp-info"
path = "src/bin/dsp-info.rs"

[dependencies]
# UI Framework (Slint with Linux Framebuffer & KMS/DRM backends)
slint = { version = "=1.9.2", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"], optional = true }

# Asynchronous Concurrency Runtime
tokio = { version = "=1.53.3", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["connect"] }
futures-util = "=0.3.34"

# D-Bus Engine for BlueZ 5 & BlueALSA
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "blocking-api"] }

# Serialization & JSON-RPC
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.140"

# Raspberry Pi Hardware Peripherals (GPIO, Hardware PWM, I2C)
rppal = { version = "=0.22.1", features = ["hal"] }
bh1750-embedded = "=0.1.0"

# EC12 Quadrature Decoding (interrupt-driven) & RGB Indicator Color Mapping
rotary-switch-helper = "=0.3.0"
led = "=0.3.1"
embedded-hal = "=0.2.7"
anyhow = "=1.0.102"

# Image Processing (Cover Art Scaling & Procedural Vinyl)
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

# System Telemetry & Thermals
sysinfo = "=0.39.6"

# Lightweight Web Remote Companion
axum = "=0.8.9"
tower-http = { version = "=0.7.1", features = ["cors", "fs"] }

# PeppyMeter meters.txt INI Configuration Parser
rust-ini = "=0.21.3"

# Logging & Structured Tracing
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

# Async Trait for Trait-based Dependency Injection / Mocks
async-trait = "=0.1.86"
memmap2 = { version = "=0.9.12", optional = true }

[features]
default = []
ui = ["dep:slint", "dep:slint-build", "dep:memmap2"]
linuxkms = ["ui", "slint/backend-linuxkms"]
simulator = ["ui", "slint/backend-winit", "slint/renderer-femtovg"]
test-util = []

[build-dependencies]
slint-build = { version = "=1.9.2", optional = true }

[lints]
workspace = true


